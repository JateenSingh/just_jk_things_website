<header
  class="bg-white dark:bg-gray-900 shadow-lg sticky top-0 z-50 transition-colors duration-300"
>
  <div class="container-custom">
    <div class="flex items-center justify-between h-16 lg:h-20">
      <!-- Logo -->
      <div class="flex items-center">
        <a routerLink="/home" class="flex items-center space-x-3">
          <div
            class="w-10 h-10 bg-gradient-primary rounded-lg flex items-center justify-center"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="white"
            >
              <path
                d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
              />
            </svg>
          </div>
          <div class="hidden sm:block">
            <span class="font-headline text-2xl font-bold text-gradient"
              >Just JK Things</span
            >
            <p class="text-xs text-gray-500 dark:text-gray-400">
              3D Printing Solutions
            </p>
          </div>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <nav class="hidden lg:flex items-center space-x-8">
        <a
          routerLink="/home"
          routerLinkActive="text-primary border-b-2 border-primary"
          class="text-gray-700 dark:text-gray-300 hover:text-primary font-medium py-2 transition-all duration-300"
        >
          Home
        </a>
        <a
          routerLink="/about"
          routerLinkActive="text-primary border-b-2 border-primary"
          class="text-gray-700 dark:text-gray-300 hover:text-primary font-medium py-2 transition-all duration-300"
        >
          About Us
        </a>
        <a
          routerLink="/catalog"
          routerLinkActive="text-primary border-b-2 border-primary"
          class="text-gray-700 dark:text-gray-300 hover:text-primary font-medium py-2 transition-all duration-300"
        >
          Catalog
        </a>
        <a
          routerLink="/how-to-order"
          routerLinkActive="text-primary border-b-2 border-primary"
          class="text-gray-700 dark:text-gray-300 hover:text-primary font-medium py-2 transition-all duration-300"
        >
          How to Order
        </a>
        <a
          routerLink="/testimonials"
          routerLinkActive="text-primary border-b-2 border-primary"
          class="text-gray-700 dark:text-gray-300 hover:text-primary font-medium py-2 transition-all duration-300"
        >
          Reviews
        </a>
        <a
          routerLink="/contact"
          routerLinkActive="text-primary border-b-2 border-primary"
          class="text-gray-700 dark:text-gray-300 hover:text-primary font-medium py-2 transition-all duration-300"
        >
          Contact
        </a>
      </nav>

      <!-- Action Buttons & Theme Toggle -->
      <div class="flex items-center space-x-4">
        <!-- Get Quote Button -->
        <a
          href="mailto:info@justjkthings.co.za?subject=Custom Quote Request"
          class="hidden md:inline-flex btn-primary text-sm"
        >
          Get Quote
        </a>

        <!-- Theme Toggle -->
        <button
          (click)="toggleTheme()"
          class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors duration-300"
          aria-label="Toggle theme"
        >
          <svg
            *ngIf="!isDarkMode"
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="5" />
            <path
              d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>
