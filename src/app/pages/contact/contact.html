<div class="min-h-screen bg-gray-50 dark:bg-gray-900">
  <!-- Hero Section -->
  <section
    class="relative py-16 bg-gradient-to-br from-accent/10 to-primary/10"
  >
    <div class="container-custom">
      <div class="text-center max-w-4xl mx-auto">
        <h1 class="text-5xl lg:text-6xl font-headline font-bold mb-6">
          Contact <span class="text-gradient">Us</span>
        </h1>
        <p class="text-xl text-gray-600 dark:text-gray-300 leading-relaxed">
          Ready to bring your ideas to life? Get in touch with us today for a
          custom quote or to learn more about our 3D printing services.
        </p>
      </div>
    </div>
  </section>

  <!-- Contact Content -->
  <section class="section-padding">
    <div class="container-custom">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-16">
        <!-- Contact Form -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8">
          <h2 class="text-3xl font-headline font-bold mb-8">
            Send us a Message
          </h2>

          <form class="space-y-6">
            <!-- Name -->
            <div>
              <label
                for="name"
                class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2"
              >
                Full Name *
              </label>
              <input
                type="text"
                id="name"
                name="name"
                required
                class="form-input"
                placeholder="Your full name"
              />
            </div>

            <!-- Email -->
            <div>
              <label
                for="email"
                class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2"
              >
                Email Address *
              </label>
              <input
                type="email"
                id="email"
                name="email"
                required
                class="form-input"
                placeholder="your.email@example.com"
              />
            </div>

            <!-- Phone -->
            <div>
              <label
                for="phone"
                class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2"
              >
                Phone Number
              </label>
              <input
                type="tel"
                id="phone"
                name="phone"
                class="form-input"
                placeholder="+27 123 456 789"
              />
            </div>

            <!-- Subject -->
            <div>
              <label
                for="subject"
                class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2"
              >
                Subject *
              </label>
              <select id="subject" name="subject" required class="form-input">
                <option value="" disabled selected>Select a topic</option>
                <option value="custom-quote">Custom Quote Request</option>
                <option value="general-inquiry">General Inquiry</option>
                <option value="product-question">Product Question</option>
                <option value="technical-support">Technical Support</option>
                <option value="partnership">Partnership Opportunity</option>
                <option value="other">Other</option>
              </select>
            </div>

            <!-- Message -->
            <div>
              <label
                for="message"
                class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2"
              >
                Message *
              </label>
              <textarea
                id="message"
                name="message"
                rows="6"
                required
                class="form-textarea"
                placeholder="Tell us about your project or inquiry..."
              ></textarea>
            </div>

            <!-- Submit Button -->
            <div>
              <button type="submit" class="btn-primary w-full">
                Send Message
              </button>
            </div>

            <!-- Privacy Notice -->
            <div class="text-sm text-gray-600 dark:text-gray-400">
              <p>
                By submitting this form, you agree to our
                <a href="/privacy" class="text-primary hover:underline"
                  >Privacy Policy</a
                >. We'll respond to your inquiry within 24 hours.
              </p>
            </div>
          </form>
        </div>

        <!-- Contact Information -->
        <div class="space-y-8">
          <!-- Contact Details -->
          <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8">
            <h2 class="text-3xl font-headline font-bold mb-8">Get in Touch</h2>

            <div class="space-y-6">
              <!-- Email -->
              <div class="flex items-start space-x-4"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
